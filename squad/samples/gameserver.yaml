apiVersion: gameplane.local/v1alpha1
kind: GameServer
metadata:
  name: squad-01
  namespace: gameplane-games
spec:
  templateRef:
    name: squad

  config:
    SERVER_NAME: "Gameplane Squad Server"
    SERVER_PASSWORD: ""
    RCON_PASSWORD: "secret-rcon-password"
    MAX_PLAYERS: "100"

  networking:
    expose: NodePort
    portOverrides:
      - name: game
        nodePort: 30787
      - name: query
        nodePort: 32165

  storage:
    size: 40Gi

  resources:
    requests: { cpu: 2, memory: 8Gi }
    limits:   { cpu: 6, memory: 16Gi }
